      <div class="faq-list">
        <details class="faq-item"><summary data-id="Apa perbedaan Joki Reguler dan Joki Gendong?" data-en="What is the difference between Regular Boost and Duo Carry?"></summary><p data-id="Pada Joki Reguler, booster bermain di akun yang dipesan. Pada Joki Gendong, kamu tetap bermain di akun sendiri dan mabar satu party dengan booster tanpa membagikan login." data-en="For Regular Boost, a booster plays on the ordered account. With Duo Carry, you play on your own account in a party with a booster without sharing login details."></p></details>
        <details class="faq-item"><summary data-id="Apakah saya perlu memberikan password untuk Joki Gendong?" data-en="Do I need to share my password for Duo Carry?"></summary><p data-id="Tidak. Joki Gendong dilakukan dengan mabar di akunmu sendiri, jadi password dan akses login tidak diperlukan." data-en="No. Duo Carry is played together on your account, so your password and login access are not needed."></p></details>
        <details class="faq-item"><summary data-id="Bagaimana harga layanan dihitung?" data-en="How is the service price calculated?"></summary><p data-id="Reguler dihitung berdasarkan bintang yang dikerjakan, sedangkan Gendong dapat dihitung per win atau per rank. Pilihan rank, add-on, dan diskon ditampilkan pada kalkulator sebelum order." data-en="Regular Boost is priced by stars gained, while Duo Carry can be priced per win or by rank. Rank selections, add-ons, and discounts are shown in the calculator before you order."></p></details>
        <details class="faq-item"><summary data-id="Apakah ada diskon untuk order dengan jumlah besar?" data-en="Are larger orders eligible for a discount?"></summary><p data-id="Ada. Kalkulator menghitung diskon volume bertingkat secara otomatis berdasarkan subtotal, hingga 20%." data-en="Yes. The calculator automatically applies tiered volume discounts based on the subtotal, up to 20%."></p></details>
        <details class="faq-item"><summary data-id="Berapa lama pengerjaan berlangsung?" data-en="How long does a service take?"></summary><p data-id="Durasi bergantung pada jarak rank, jumlah bintang atau win, antrean booster, dan jadwal yang disepakati. Kalkulator memberi estimasi awal; admin mengonfirmasi jadwal sebelum order dimulai." data-en="Timing depends on rank distance, stars or wins requested, booster availability, and the agreed schedule. The calculator gives an initial estimate; our admin confirms the schedule before work begins."></p></details>
        <details class="faq-item"><summary data-id="Bagaimana jika kalah saat Joki Gendong?" data-en="What happens if I lose during Duo Carry?"></summary><p data-id="Paket Gendong memiliki garansi win sesuai ketentuan layanan. Admin akan menjelaskan penggantian win saat detail paket dikonfirmasi." data-en="Duo Carry packages include a win guarantee under the service terms. Our admin explains the replacement win when confirming your package."></p></details>
        <details class="faq-item"><summary data-id="Apakah permainan menggunakan cheat?" data-en="Does the booster use cheats?"></summary><p data-id="Tidak. Pengerjaan dilakukan secara manual dan tidak menggunakan cheat atau program ilegal." data-en="No. All games are played manually without cheats or illegal programs."></p></details>
        <details class="faq-item"><summary data-id="Bagaimana cara mulai memesan?" data-en="How do I place an order?"></summary><p data-id="Atur rank dan layanan pada kalkulator, periksa estimasi, lalu kirim detailnya ke admin WhatsApp. Jadwal dan ketersediaan booster dikonfirmasi sebelum pengerjaan." data-en="Set your rank and service in the calculator, review the estimate, then send the details to our WhatsApp admin. Scheduling and booster availability are confirmed before work begins."></p></details>
        <details class="faq-item"><summary data-id="Kapan pembayaran dilakukan?" data-en="When is payment arranged?"></summary><p data-id="Admin akan menjelaskan metode dan waktu pembayaran setelah detail order serta jadwal disepakati. Jangan mengirim pembayaran ke kontak selain kanal resmi BengkelML." data-en="Our admin will explain payment methods and timing after the order details and schedule are agreed. Do not send payment to contacts outside BengkelML's official channels."></p></details>
